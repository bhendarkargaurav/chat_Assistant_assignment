services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lenny:lenny@db:5432/lenny_assistant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ollama
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
